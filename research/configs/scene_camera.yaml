# Back/pole camera -- a second, fixed (non-wrist) RGB-D viewpoint standing in for the
# real robot's rear-mounted RealSense on a vertical pole (see the user-supplied photo,
# 2026-09-24). Loaded by sim/scripts/run_robot129_ros_webrtc.py when
# --scene-camera pole is passed; the default --scene-camera off leaves the scene byte-
# for-byte unchanged from before this camera existed.
#
# status: ROUGH_FROM_PHOTO -- read off a phone AR-ruler sketch + the user's own estimate
# of the pole's corner relative to the arm base, NOT a measured/calibrated extrinsic.
# Per AGENTS.md ("never guess TCP, camera transforms... leave as typed placeholders
# until measured"), this is explicitly flagged rather than presented as calibrated, and
# calibration/registry.yaml's "only VERIFIED files may replace simulation nominal
# values" rule applies here too once a real measurement exists.
#
# Per the user's instruction (2026-09-24): only the camera + its supporting pole are
# simulated here, not the cart/box the real arm sits on. base_link's own origin (world
# origin, world_to_base is an identity fixed joint) is treated as sitting at the cart's
# top surface height, so offsets below are directly "metres above/behind/beside the arm
# base" with no separate cart-height term.
pole_camera:
  status: AUTHORED_DEMO_VIEW
  # Keep the photo estimate separate; it has not been calibrated on hardware.
  photo_estimate_offset_from_base_m: [-0.15, -0.115, 0.36]
  photo_estimate_pitch_deg: 0.0
  # [x, y, z] metres, camera optical center relative to base_link's origin == world
  # origin. Frame convention: REP103 (+X = arm's reach direction at joint1=0, +Y = left,
  # +Z = up). x<0: behind the base. y<0: the arm's right side (confirmed with the user
  # 2026-09-24 against "camera pole on the right side", matching the upstream
  # base_action.py comment). z: height above the base-mount plane.
  # The demo pole is 25 cm farther behind and 24 cm higher than the photo estimate;
  # otherwise the arm occludes the A/B obstacle in the camera image.
  offset_from_base_m: [-0.40, -0.115, 0.60]
  # Positive pitch looks downward. This demo angle overrides the horizontal
  # orientation estimated for the physical camera; see photo_estimate_pitch_deg.
  pitch_deg: 25.0
  # Demo yaw aims the uncalibrated camera toward the A/B obstacle corridor.
  # It is a simulation framing choice, not a measured physical extrinsic.
  yaw_deg: 30.0
  intrinsics:
    width: 640
    height: 480
    # Wider demo framing so the arm is not clipped into the upper-left corner.
    # This is an authored simulation view, not measured D435 intrinsics.
    # fx=fy ~ 329 px at this aperture/focal-length pair, so the arm and A/B
    # obstacle corridor fit in the same view instead of being cropped out.
    focal_length_mm: 18.0
    horizontal_aperture_mm: 35.0
    clipping_range_m: [0.05, 5.0]
  pole:
    # Visual + static collision only (so cuRobo can treat it as a known obstacle) -- a
    # thin square post standing in for the real aluminum-extrusion pole. This is NOT the
    # cart itself, only the pole the camera is mounted on, per the user's instruction.
    half_extent_m: 0.015   # 3cm x 3cm cross-section
    color_rgb: [0.65, 0.65, 0.68]

# Fixed "global view" camera (dashboard window 2, docs/dev_guide_paper_core_and_dashboard_plan.md
# §8) -- RGB-only, always spawned (unlike pole_camera, no on/off flag), previously only
# used internally for --record's overview video and never published to ROS. eye/target
# default here are byte-for-byte the values that were hardcoded in
# sim/scripts/run_robot129_ros_webrtc.py before this section existed (1.05, 0.95, 0.85
# looking at 0.30, -0.05, 0.05 + TABLE_Z), so leaving this key out of a stripped-down
# config file falls back to the exact same view (see the Python-side default).
overview_camera:
  status: AUTHORED_NOT_MEASURED  # a framing choice for a demo camera, not a real-world extrinsic
  eye_m: [1.05, 0.95, 0.85]
  # target_xy_m + target_z_base_m: target_z_base_m + TABLE_Z (0 normally, the pedestal
  # height for --scene pick_place_counter) is the actual look-at Z, matching how the
  # original hardcoded `0.05 + TABLE_Z` behaved.
  target_xy_m: [0.30, -0.05]
  target_z_base_m: 0.05
