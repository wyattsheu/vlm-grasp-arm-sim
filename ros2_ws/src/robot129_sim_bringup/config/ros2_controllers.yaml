/robot129_sim/controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: false
    joint_state_broadcaster: {type: joint_state_broadcaster/JointStateBroadcaster}
    arm_controller: {type: joint_trajectory_controller/JointTrajectoryController}
    gripper_controller: {type: joint_trajectory_controller/JointTrajectoryController}
/robot129_sim/arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
/robot129_sim/gripper_controller:
  ros__parameters:
    # joint8 is the passive mimic of joint7 and has no command interface.
    joints: [joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
